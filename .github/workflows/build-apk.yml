
name: FinanceHub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Android-Projekt laden
        run: |
          git clone --branch dev --depth 1 https://github.com/xchacha20-poly1305/webview-apk-template.git android-template

      - name: Vorlage und Konfiguration prüfen
        run: |
          find android-template -maxdepth 4 -type f | sort
          cat android-template/README.md
